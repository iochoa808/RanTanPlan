[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "planmt"
version = "0.0.1"
authors = [
  { name="Your Name", email="your.email@example.com" },
]
description = "A Unified Planning wrapper for a C++ SAT planner using protobuf file communication."
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "unified-planning[grpc]>=1.0.0",
    "protobuf==5.29.3"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["planmt*"]

[project.entry-points."unified_planning.engines"]
my_cpp_sat_planner = "planmt.planner_wrapper:MyCppSATPlanner"

[project.urls]
"Homepage" = "https://github.com/yourusername/planmt"